name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run validator
        shell: pwsh
        run: ./validate.ps1

      - name: Run trigger evals
        run: node scripts/run-evals.js

      - name: Install test
        shell: pwsh
        run: ./validate.ps1 -TestInstall
